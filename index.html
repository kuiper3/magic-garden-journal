<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Garden Journal</title>
  <meta name="description" content="Personal crop and pet variant tracker for Magic Garden">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/nav.css">
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- AUTH GATE -->
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-emblem" aria-hidden="true">🌿</div>
        <h1 class="auth-title">Magic Garden<br><em>Journal</em></h1>
        <p class="auth-subtitle">Personal progress tracker</p>
      </div>

      <form id="signin-form" class="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email" id="email" name="email"
            autocomplete="email" required
            placeholder="you@example.com"
          >
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="field-password-wrap">
            <input
              type="password" id="password" name="password"
              autocomplete="current-password" required
              placeholder="••••••••"
            >
            <button type="button" id="toggle-password" class="btn-show-pw" aria-label="Show password">
              <!-- Eye open (shown when password is hidden) -->
              <svg id="icon-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye crossed (shown when password is visible) -->
              <svg id="icon-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="auth-error" class="auth-error hidden" role="alert"></div>

        <button type="submit" id="signin-btn" class="btn-signin">
          <span class="btn-label">Sign in</span>
          <span class="btn-spinner hidden" aria-hidden="true"></span>
        </button>
      </form>

      <p class="auth-version">v0.7.0 · Magic Garden Journal</p>
    </div>
  </div>

  <!-- APP SHELL (mounted after auth) -->
  <div id="app" class="app hidden">
    <nav id="nav" class="nav"></nav>
    <main id="main" class="main"></main>
  </div>

  <script type="module" src="js/app.js"></script>

  <!-- Password show/hide toggle -->
  <script>
    document.getElementById('toggle-password')?.addEventListener('click', function () {
      const input   = document.getElementById('password');
      const iconShow = document.getElementById('icon-show');
      const iconHide = document.getElementById('icon-hide');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      iconShow.classList.toggle('hidden', isHidden);
      iconHide.classList.toggle('hidden', !isHidden);
      this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  </script>

  <!-- Background particle animation -->
  <script>
    (function () {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const motes = [];
      const COUNT = 28;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function randomMote() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.6 + 0.4,
          speed: Math.random() * 0.25 + 0.08,
          drift: (Math.random() - 0.5) * 0.15,
          opacity: 0,
          maxOpacity: Math.random() * 0.45 + 0.1,
          phase: Math.random() * Math.PI * 2,
          phaseSpeed: Math.random() * 0.008 + 0.004,
        };
      }

      resize();
      window.addEventListener('resize', resize);
      for (let i = 0; i < COUNT; i++) motes.push(randomMote());

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        motes.forEach(m => {
          m.phase += m.phaseSpeed;
          m.opacity = m.maxOpacity * (0.5 + 0.5 * Math.sin(m.phase));
          m.y -= m.speed;
          m.x += m.drift;
          if (m.y < -10) { Object.assign(m, randomMote()); m.y = canvas.height + 10; }
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(180, 220, 140, ${m.opacity})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

</body>
</html>
